<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя перша гра</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container game-page">
        <div id="timerDisplay">Залишилось: 60</div> <!-- таймер -->
        <div id="gameBoard" class="game-board">
            <!-- клітинки з цифрами -->
        </div>
        <button id="restartGameBtn">Почати з початку</button> <!-- кнопка рестарту -->

        <div class="stats-section">
            <h2>Статистика Спроб</h2>
            <table id="statsTable">
                <thead>
                    <tr>
                        <th>Назва гри</th>
                        <th>Час</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- статистика -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="game.js"></script> <!-- скрипт гри -->
</body>
</html>
